# =====================================================================
# Publica el visualizador web (web/frontend) en GitHub Pages.
#
# En Pages no hay servidor Python, así que el sitio se compila en MODO
# ESTÁTICO en dos pasos:
#   1. web/exportar_estatico.py vuelca la API a JSON (resultados/resultados.db
#      -> web/frontend/public/datos/**). La BD es de solo lectura, por eso las
#      respuestas se pueden precalcular.
#   2. Vite compila el frontend con VITE_DATOS_ESTATICOS=1 (api.js lee los JSON
#      en vez de /api/...) y VITE_BASE=/<repo>/ (el sitio cuelga de un
#      subdirectorio, no de la raíz del dominio).
#
# El proyecto puede estar en la raíz del repo o dentro de una subcarpeta
# (ahora mismo, "Homomorphic Encription/"): el primer paso lo detecta, así que
# no hay que tocar este fichero si se reorganiza el repositorio.
#
# Requisito único en el repo: Settings -> Pages -> Source = "GitHub Actions".
# =====================================================================
name: Desplegar la web en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña Actions

# Permisos que necesita el despliegue oficial de Pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancelan los que ya están en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # 1) Compilar el sitio estático
  # -------------------------------------------------------------------
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      # Localiza la carpeta que contiene web/ (la "raíz del proyecto"), esté en
      # la raíz del repo o anidada. Deja la ruta en steps.raiz.outputs.proyecto.
      - name: Localizar la raíz del proyecto
        id: raiz
        run: |
          RUTA=$(find . -path ./.git -prune -o -path '*/web/exportar_estatico.py' -print | head -1)
          if [ -z "$RUTA" ]; then
            echo "::error::No encuentro web/exportar_estatico.py en el repositorio."
            exit 1
          fi
          PROY=$(dirname "$(dirname "$RUTA")")   # .../web/exportar_estatico.py -> ...
          PROY=${PROY#./}
          [ -z "$PROY" ] && PROY="."
          echo "proyecto=$PROY" >> "$GITHUB_OUTPUT"
          echo "Proyecto detectado en: '$PROY'"

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # requirements.txt completo (torch, tenseal…) NO hace falta aquí: la
      # exportación solo lee la BD con pandas y reutiliza las funciones de
      # web/backend/api.py, que importa FastAPI a nivel de módulo.
      - name: Instalar dependencias de la exportación
        run: pip install "pandas>=2.2" "numpy>=2.0" fastapi

      # El script deduce sus rutas de su propia ubicación, así que da igual
      # desde dónde se invoque.
      - name: Exportar la BD a JSON estáticos
        run: python "${{ steps.raiz.outputs.proyecto }}/web/exportar_estatico.py"

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'            # Vite 8 exige >=20.19 / >=22.12
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Instalar dependencias del frontend
        working-directory: ${{ steps.raiz.outputs.proyecto }}/web/frontend
        run: npm ci

      # VITE_BASE se deduce del nombre del repo para no tener que tocar nada si
      # se renombra. Caso especial: en un sitio de usuario (usuario.github.io)
      # la web cuelga de la raíz.
      - name: Compilar el frontend (modo estático)
        working-directory: ${{ steps.raiz.outputs.proyecto }}/web/frontend
        env:
          VITE_DATOS_ESTATICOS: '1'
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          echo "Compilando con VITE_BASE=$BASE"
          VITE_BASE="$BASE" npm run build

      # Se copia a una ruta fija de la raíz: evita pasar a las acciones de Pages
      # una ruta con espacios ("Homomorphic Encription/…").
      - name: Preparar el artefacto
        run: |
          rm -rf _sitio && mkdir _sitio
          cp -R "${{ steps.raiz.outputs.proyecto }}/web/frontend/dist/." _sitio/
          touch _sitio/.nojekyll
          # Red de seguridad: si la exportación fallara en silencio se
          # publicaría una web en blanco. Mejor romper el despliegue aquí.
          test -f _sitio/index.html
          test -f _sitio/datos/estado.json
          echo "JSON publicados: $(find _sitio/datos -name '*.json' | wc -l)"

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _sitio

  # -------------------------------------------------------------------
  # 2) Desplegar el artefacto en Pages
  # -------------------------------------------------------------------
  desplegar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
